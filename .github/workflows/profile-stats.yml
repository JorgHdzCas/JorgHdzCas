name: Refresh Neofetch profile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public data and local cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Commit updated cards
        run: |
          if ! git diff --quiet -- profile.json assets; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add profile.json assets
            git commit -m 'Refresh Neofetch profile'
            git push
          fi
